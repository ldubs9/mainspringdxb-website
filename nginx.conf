server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Coolify terminates TLS in front of this container, so log the real client.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Dotfiles are never public.
    location ~ /\. {
        deny all;
    }

    # HTML and data are re-fetched on every load: routing and product data must
    # stay fresh, and components are already cache-busted with ?v= by loader.js.
    location ~* \.(html|json)$ {
        add_header Cache-Control "no-cache" always;
    }

    # CSS/JS carry a ?v= query string that is bumped on release, but keep the
    # window short so a missed bump does not strand visitors on stale code.
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=3600" always;
    }

    location ~* \.(jpg|jpeg|png|gif|webp|avif|svg|ico|woff2?|ttf)$ {
        add_header Cache-Control "public, max-age=2592000" always;
    }

    # Query-param routing (?page=...) means every path resolves to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
